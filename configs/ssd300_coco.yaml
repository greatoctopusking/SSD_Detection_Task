# ============================================================
# SSD300 + VGG16 (COCO2017) 训练配置 —— CUDA / CPU 通用
#   设备：device: auto（有 CUDA 用 GPU，否则 CPU）
#   每个路径都可以写相对项目根（./data/...）或绝对路径
# ============================================================

# ---------- 设备 ----------
device: auto                 # auto | cuda | cpu

# ---------- 数据 ----------
data:
  root: ./data
  # 训练集：全量 COCO2017 train2017（118k 张，18GB）
  train:
    image_dir: ./data/train2017
    anno_json: ./data/annotations/instances_train2017.json
    ids_json: ./data/subsets/train_ids.json    # null = 用 json 中全部（有标注的）图片
  # 验证集：全量 COCO2017 val2017（5000 张）
  val:
    image_dir: ./data/val2017
    anno_json: ./data/annotations/instances_val2017.json
    ids_json: ./data/subsets/val_ids.json      # null = 用 json 中全部图片
  num_workers: 8             # CUDA 建议 8；Windows/CPU 调试建议 0
  pin_memory: true           # CUDA 下自动生效（加速 Host→Device）
  prefetch_factor: 4
  color_jitter: true         # 训练时的随机颜色抖动

# ---- 小数据冒烟（无全量数据时，把上面 train/val 两块临时换成下面两行）----
#   train: {image_dir: ./data/images, anno_json: ./data/annotations/instances_val2017.json, ids_json: ./data/subsets/train_ids.json}
#   val:   {image_dir: ./data/images, anno_json: ./data/annotations/instances_val2017.json, ids_json: ./data/subsets/val_ids.json}

# ---------- 模型（手册结构参数） ----------
model:
  num_classes: 81              # COCO 80 类 + background
  input_size: [300, 300]
  num_ssd_boxes: 8732          # 6 层锚点总数
  feature_map_sizes: [38, 19, 10, 5, 3, 1]
  boxes_per_point: [4, 6, 6, 6, 4, 4]
  scales_min: 0.1
  scales_max: 0.95
  fk_divisors: [8, 16, 32, 64, 100, 300]     # 300/该值 = 归一化分母
  prior_scaling_xy: 0.1
  prior_scaling_wh: 0.2
  pretrained_backbone: true    # 加载 ImageNet 预训练 VGG16（含 fc6/fc7 → conv6/conv7 迁移）

# ---------- 损失 ----------
loss:
  type: multibox               # multibox(论文原版: softmax + hard negative mining) | focal(手册版)
  neg_pos_ratio: 3             # HNM 负:正 比例
  alpha: 1.0                   # 定位损失权重
  focal_alpha: 0.75            # 仅 loss.type=focal 时生效
  focal_gamma: 2.0             # 同上

# ---------- 训练 ----------
train:
  seed: 1
  batch_size: 16               # 显存 8G 可从 16 起；12G+ 可 32（lr 相应线性放大）
  epochs: 60                   # 对齐手册（GPU 上 COCO 全量单轮约数分钟）
  lr_init: 0.001
  lr_max: 0.04                 # batch16 对应 lr；batch32 → 0.08
  lr_end_ratio: 0.05           # lr_end = lr_init * 该比例
  warmup_epochs: 2
  momentum: 0.9
  weight_decay: 0.0005
  grad_clip: 10.0              # 梯度裁剪（保险丝）
  amp: true                    # CUDA 下启用混合精度（提速/省显存）
  deterministic: false         # true 可复现但更慢
  log_every_n_steps: 20
  save_every_n_epochs: 1       # current_checkpoint 保存频率（0 = 不保存）
  keep_every_n_epochs: 10      # 中间快照：另存 epochNNN_checkpoint.pth（0 = 关闭；约 131MB/份）
  eval_every_n_epochs: 5       # 训练中途验证 mAP 的频率（0 = 不评估）
  best_metric: map             # map（只在评估轮次比较，推荐）| loss

# ---------- 评估 / 推理 ----------
eval:
  batch_size: 8
  min_score: 0.1               # softmax 概率阈值（focal 训练可调 0.2~0.45）
  nms_threshold: 0.6
  max_boxes: 100
  ckpt_path: ./checkpoints/20260910_172825/best_checkpoint.pth   # 也可写 checkpoints/<时间戳>/best_checkpoint.pth

# ---------- 输出路径 ----------
paths:
  ckpt_root: ./checkpoints     # 每次训练在下面新建 <日期>_<时间>/ 子目录
  output_dir: ./outputs        # 评估 json / 可视化图片
  plot: true                   # 每 epoch 绘制 curves.png
  log_name: train_log.txt
